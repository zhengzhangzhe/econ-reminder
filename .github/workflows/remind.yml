name: Daily Economic Reminder

on:
  repository_dispatch:
    types: [remind]
  workflow_dispatch:  # 保留手动触发，方便测试

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reminder
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: python econ_reminder.py
