name: Daily Economic Reminder

on:
  schedule:
    - cron: "0 0 * * *"  # UTC 00:00 = 北京 08:00
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Skip weekends
        run: |
          DOW=$(TZ='Asia/Shanghai' date +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "Weekend, skipping"
            exit 0
          fi

      - name: Run reminder
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: python econ_reminder.py
