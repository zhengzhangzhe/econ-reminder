name: Daily Economic Reminder

on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Skip weekends
        run: |
          DOW=$(TZ='Asia/Shanghai' date +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "Weekend (Beijing), skipping"
            exit 0
          fi

      - name: Run reminder
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: python econ_reminder.py
